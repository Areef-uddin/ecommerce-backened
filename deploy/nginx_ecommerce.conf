# Nginx Configuration for E-Commerce Platform on Webyne VPS (157.15.203.209)
# Serves:
# 1. Customer Web App (Flutter SPA) at http://157.15.203.209/
# 2. Admin Panel (React Vite SPA) at http://157.15.203.209/admin-panel/
# 3. Django REST API at http://157.15.203.209/api/
# 4. Django Admin at http://157.15.203.209/admin/
# 5. Media & Uploads at http://157.15.203.209/media/
# 6. Static files at http://157.15.203.209/static/

server {
    listen 80;
    listen [::]:80;
    server_name 157.15.203.209 _;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2 font/woff;

    # 1. Django REST API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 2. Django Built-in Admin Proxy
    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Django Static Files
    location /static/ {
        alias /var/www/ecommerce/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 4. Uploaded Media & Virtual Try-On Results
    location /media/ {
        alias /var/www/ecommerce/backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 5. React Vite Admin Panel (SPA at /admin-panel/)
    location ^~ /admin-panel/ {
        alias /var/www/ecommerce/admin_panel/dist/;
        index index.html;
        try_files $uri $uri/ /admin-panel/index.html;
    }

    # 6. Flutter Web Customer App (Root SPA at /)
    location / {
        root /var/www/ecommerce/customer_app/build/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Disable cache for flutter service worker and index to ensure fast updates
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location = /flutter_service_worker.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
